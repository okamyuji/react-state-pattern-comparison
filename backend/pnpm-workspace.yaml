# 公開から7日未満の版を入れない。依存の乗っ取りへの備え。緊急時だけminimumReleaseAgeExcludeにname@versionで1版ずつ足す
minimumReleaseAge: 10080
overrides:
  morgan: ">=1.11.0"
  qs: ">=6.15.2"
  brace-expansion@>=5.0.0 <5.0.8: ">=5.0.8"
  brace-expansion@>=2.0.0 <2.0.3: ">=2.0.3"
  brace-expansion@>=1.0.0 <=1.1.11: ">=1.1.12"
  lodash: ">=4.18.0"
  path-to-regexp: ">=0.1.13"
  postcss: ">=8.5.18"
  body-parser: ^1.20.6
  "minimatch@>=10.0.0 <11.0.1": ^11.0.3
# 7日未満の版の例外。1版ずつ書き、7日を過ぎたら消す
minimumReleaseAgeExclude:
