name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      working-directory: backend
      typecheck-command: "run build"

  flag-pattern:
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      working-directory: flag-pattern
      typecheck-command: "run build"

  fsm-pattern:
    uses: okamyuji/reusable-workflows/.github/workflows/node-ci.yml@v1
    with:
      node-version: "24"
      working-directory: fsm-pattern
      typecheck-command: "run build"

  security:
    permissions:
      contents: read
      pull-requests: write
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@v1
